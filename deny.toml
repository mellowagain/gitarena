[advisories]
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "waiting for actix/actix-web#4321" },
    { id = "RUSTSEC-2023-0071", reason = "only private key operations are affected, we use ed25519 host keys and only verify rsa signatures" },
    { id = "RUSTSEC-2026-0387", reason = "waiting for kanidm/webauthn-rs#583, webauthn only uses public keys" },
    { id = "RUSTSEC-2026-0374", reason = "waiting for askama-rs/askama#771, compile time only" },
    { id = "RUSTSEC-2020-0163", reason = "waiting for XAMPPRocky/tokei#1347" },
    { id = "RUSTSEC-2025-0074", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2025-0075", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2025-0080", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2025-0081", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2025-0098", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2025-0104", reason = "build time only, tokei needs to upgrade to tera 2" },
    { id = "RUSTSEC-2024-0449", reason = "build time only, linguist needs to replace serde_yaml_ng" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
wildcards = "deny"
deny = [
    { crate = "native-tls", reason = "use rustls" },
    { crate = "tokio-native-tls", reason = "use rustls" },
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
