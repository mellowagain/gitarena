name: Backend CI

on:
  - push
  - pull_request

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: build
        run: cargo build --verbose --release

      - name: install git-bug v0.11.0 for tests
        run: |
          curl -fsSL https://github.com/git-bug/git-bug/releases/download/v0.11.0/git-bug_linux_amd64 -o /usr/local/bin/git-bug
          chmod +x /usr/local/bin/git-bug

      - name: test
        run: cargo test --verbose

      - name: clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # 1.5.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: rustfmt check
        run: cargo fmt -- --check

      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitarena
          path: target/release/gitarena
