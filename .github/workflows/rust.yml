name: Backend CI

on:
  - push
  - pull_request_target

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --verbose --release

      - name: install git-bug for tests
        run: |
          curl -fsSL https://github.com/git-bug/git-bug/releases/download/v0.10.1/git-bug_linux_amd64 -o /usr/local/bin/git-bug
          chmod +x /usr/local/bin/git-bug

      - name: test
        run: cargo test --verbose

      - name: clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # v1.5.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: rustfmt check
        run: cargo fmt -- --check

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitarena
          path: target/release/gitarena
