name: Docker build

on:
  push:
    branches:
      - main
    tags:
      - gitarena-v*
      - gitarena-frontend-v*

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: select targets
        id: targets
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/gitarena-frontend-v*) targets='["frontend"]' ;;
            refs/tags/gitarena-v*) targets='["backend","zoekt-webserver","all-in-one"]' ;;
            *) targets='["backend","zoekt-webserver","frontend","all-in-one"]' ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: login to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to docker hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build and push by digest
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          CACHE_SCOPE: ${{ matrix.arch }}
          PUSH_BY_DIGEST: "true"
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ join(fromJSON(needs.prepare.outputs.targets), ',') }}
          set: |
            *.platform=${{ matrix.platform }}

      - name: export digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          jq -r 'to_entries[] | select(.value | type == "object" and has("containerimage.digest")) | "\(.key) \(.value["containerimage.digest"])"' <<< "$METADATA" |
            while read -r target digest; do
              mkdir -p "digests/$target"
              touch "digests/$target/${digest#sha256:}"
            done

      - name: upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: image names
        id: names
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            backend) image=gitarena; release=gitarena ;;
            frontend) image=gitarena-frontend; release=gitarena-frontend ;;
            *) image="gitarena-$TARGET"; release=gitarena ;;
          esac
          {
            echo "ghcr=ghcr.io/mellowagain/$image"
            echo "dockerhub=docker.io/mellowagain/$image"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: login to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to docker hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ steps.names.outputs.dockerhub }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=match,pattern=^${{ steps.names.outputs.release }}-v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^${{ steps.names.outputs.release }}-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^${{ steps.names.outputs.release }}-v(\d+)\.\d+\.\d+$,group=1

      - name: create manifest list and push
        id: push
        working-directory: digests/${{ matrix.target }}
        env:
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$GHCR_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: generate attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: generate docker hub attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.dockerhub }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: checkout
        if: matrix.target == 'backend'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sync docker hub description
        if: matrix.target == 'backend'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mellowagain/gitarena
          enable-url-completion: true

  deploy:
    needs: merge
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/deploy.yml
    secrets:
      SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
