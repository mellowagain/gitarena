name: Git Tests

on:
  - push
  - pull_request

permissions:
  contents: read
  actions: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://gitarena:gitarena@localhost:5432/gitarena

jobs:
  git-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: gitarena
          POSTGRES_PASSWORD: gitarena
          POSTGRES_DB: gitarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitarena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest

      - name: install git-bug v0.11.0
        run: |
          curl --proto "=https" --tlsv1.2 -sSf -L https://github.com/git-bug/git-bug/releases/download/v0.11.0/git-bug_linux_amd64 -o /usr/local/bin/git-bug
          chmod +x /usr/local/bin/git-bug

      - name: tool versions
        run: |
          git --version
          ssh -V
          git-bug version

      - name: test
        run: cargo nextest run --locked --workspace --profile ci

      - name: upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-tests-junit
          path: target/nextest/ci/junit.xml

      - name: display test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Backend tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
