name: Deploy to git.mari.zip

on:
  workflow_call:
    secrets:
      SSH_ADDRESS:
        required: true
      SSH_PORT:
        required: true
      SSH_USERNAME:
        required: true
      SSH_KEY:
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://git.mari.zip
    steps:
      - name: ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/gitarena/
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: wait for deploy
        run: sleep 30

      - name: check if update succeeded
        run: |
          response=$(curl -sf https://api.git.mari.zip/api)
          parsed=$(echo "$response" | jq)
          
          echo "Curl response:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$parsed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          commit=$(echo "$response" | jq -r '.commit')
          
          if [ "$commit" != "${GITHUB_SHA}" ]; then
            echo "::error::hash mismatched."
            echo "::error::deployed: $commit"
            echo "::error::expected: ${GITHUB_SHA}"
            exit 1
          else
            echo "hash matched. deploy success."
          fi
