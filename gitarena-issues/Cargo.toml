[package]
name = "gitarena-issues"
version = "0.2.1"
authors = { workspace = true }
edition = "2024"
license = { workspace = true }
repository = { workspace = true }
description = "Rust library for interacting with `git-bug` as used by the GitArena forge"

[lints]
workspace = true

[features]
tracing = ["dep:tracing"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
gix = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { version = "=1.4.1", features = ["unstable"] }
tempfile = "3.23.0"
test-with = { version = "0.17.2", default-features = false, features = ["executable"] }
