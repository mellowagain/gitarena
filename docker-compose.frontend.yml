services:
  frontend:
    build:
      context: ./gitarena-frontend
      additional_contexts:
        license: .
    image: ghcr.io/mellowagain/gitarena-frontend:main
    environment:
      BACKEND_URL: ${BACKEND_URL:?set BACKEND_URL to the URL of your backend}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
