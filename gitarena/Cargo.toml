[package]
name = "gitarena"
version = { workspace = true }
authors = { workspace = true }
edition = "2024"
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
build = "build.rs"

[[bin]]
name = "gitarena"

[lints]
workspace = true

[dependencies]
actix-identity = "0.9.0"
actix-multipart = "0.8.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.14.0", features = ["secure-cookies"] }
anyhow = { workspace = true }
askalono = { version = "0.4.4", git = "https://github.com/mellowagain/askalono" } # Currently uses my own fork until https://github.com/jpeddicord/askalono/pull/73 is merged
askama = { version = "0.16.0", default-features = false, features = ["config", "derive", "std"] }
async-compression = { version = "0.4.42", features = ["gzip", "tokio"] }
async-recursion = "1.1.1"
async-trait = "0.1.89"
awc = { version = "3.8.2", features = ["rustls"] }
base64 = { workspace = true }
bstr = "1.12.3"
bytes = "1.12.0"
chrono = { workspace = true }
console-subscriber = { version = "0.5.0", features = ["parking_lot"] }
derive_more = { version = "2.1.1", features = ["debug"] }
dos-date-time = { version = "0.3.0", features = ["chrono"] }
either = "1.16.0"
fang = { version = "0.11.0-rc1", default-features = false, features = ["asynk-postgres"], git = "https://github.com/rustworthy/fang", rev = "187a10be2024b8f78c0a85af32294aafd183e248" }
fs2 = "0.4.3"
fs_extra = "1.3.0"
futures = "0.3.32"
futures-locks = "0.7.1"
git2 = "0.20.0"
gitarena-issues = { path = "../gitarena-issues" }
gitarena-macros = { path = "../gitarena-macros" }
gix = { workspace = true, features = ["async-network-client"] }
hex = { workspace = true }
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }
http = "1.4.2"
image = "0.25.10"
infer = "0.19.0"
ipnetwork = { version = "0.21.1", features = ["serde"] }
itertools = "0.15.0"
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls", "ring", "builder", "hostname"] }
linguist = "0.1.10"
log = "0.4.33"
maxminddb = "0.29.0"
md5 = "0.8.0"
memmem = "0.1.1"
meilisearch-sdk = "0.33.0"
num_cpus = "1.17.0"
oauth2 = { version = "4.1.0", default-features = false, git = "https://github.com/mellowagain/oauth2-rs" }
object_store = { version = "0.14.0", features = ["tokio", "http", "aws"] }
once_cell = "1.21.4"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = { version = "0.32.0", default-features = false, features = ["log"] }
opentelemetry-instrumentation-actix-web = { version = "0.24.0", features = ["metrics", "awc"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "tls-webpki-roots", "http-proto", "http-json", "reqwest-rustls-webpki-roots"] }
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
qstring = "0.7.2"
rand = { workspace = true }
russh = { version = "0.61.2", features = ["aws-lc-rs", "serde"] }
rust-argon2 = { version = "3.0.0", features = ["crossbeam-utils"] }
serde = { workspace = true }
sha2 = { workspace = true }
serde_cbor_2 = "0.13.0"
serde_json = { workspace = true }
sqlx = { version = "0.9.0", features = ["chrono", "ipnetwork", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
sysinfo = "0.39.5"
time = "=0.3.51"
tokei = { version = "14.0.0", default-features = false }
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tokio-tar = "0.3.1"
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "std"] }
tracing-unwrap = "1.0.1"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "url", "uuid"] }
utoipa-rapidoc = { version = "6.0.0", features = ["actix-web"] }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
vergen-gitcl = { version = "10.0.1", features = ["build", "rustc"] }
