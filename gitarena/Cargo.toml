[package]
name = "gitarena"
version = { workspace = true }
authors = { workspace = true }
edition = "2024"
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
build = "build.rs"

[[bin]]
name = "gitarena"

[lints]
workspace = true

[dependencies]
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.18.1", features = ["cookies", "secure-cookies"] }
anyhow = { workspace = true }
askalono = "0.5.0"
askama = { version = "0.16.1", default-features = false, features = ["config", "derive", "std"] }
async-compression = { version = "0.4.51", features = ["gzip", "tokio"] }
async-recursion = "1.2.0"
async-trait = "0.1.92"
awc = { version = "3.11.0", features = ["rustls"] }
base64 = { workspace = true }
bstr = "1.13.1"
bs58 = "0.5.1"
bytes = "1.12.1"
chrono = { workspace = true }
console-subscriber = { version = "0.5.0", features = ["parking_lot"] }
derive_more = { version = "2.1.1", features = ["debug"] }
dos-date-time = { version = "0.3.0", features = ["chrono"] }
either = "1.19.0"
fang = { version = "0.11.0", default-features = false, features = ["asynk-postgres"] }
fs2 = "0.4.3"
fs_extra = "1.3.0"
futures = "0.3.34"
futures-locks = "0.7.1"
git2 = "0.20.0"
gitarena-issues = { path = "../gitarena-issues", features = ["tracing"] }
gitarena-macros = { path = "../gitarena-macros" }
gix = { workspace = true, features = ["async-network-client"] }
hex = { workspace = true }
hmac = "0.12.1"
infer = "0.22.0"
ipnetwork = { version = "=0.20.0", features = ["serde"] } # needs to be in sync with the version sqlx uses
itertools = "0.15.0"
lettre = { version = "0.11.23", features = ["smtp-transport", "tokio1", "tokio1-native-tls"] }
linguist = "0.1.17"
maxminddb = "0.24"
memmem = "0.1.1"
meilisearch-sdk = "0.33.0"
num_cpus = "1.17.0"
oauth2 = { version = "4.1.0", default-features = false, git = "https://github.com/mellowagain/oauth2-rs" }
http = "1.5.0"
object_store = { version = "0.14.2", features = ["tokio", "http", "aws"] }
once_cell = "1.21.4"
opentelemetry = "0.31.0"
opentelemetry-appender-tracing = { version = "0.31.1", default-features = false, features = ["log"] }
opentelemetry-instrumentation-actix-web = { version = "0.23.0", features = ["metrics", "awc"] }
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic", "tls-webpki-roots", "http-proto", "http-json", "reqwest-rustls-webpki-roots"] }
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
qstring = "0.7.2"
rand = { workspace = true }
russh = { version = "0.60.2", features = ["aws-lc-rs", "serde"] }
rust-argon2 = { version = "3.0.0", features = ["crossbeam-utils"] }
serde = { workspace = true }
sha2 = "0.10"
serde_cbor_2 = "0.13.0"
serde_json = { workspace = true }
sqlx = { version = "0.8.6", features = ["chrono", "ipnetwork", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
sysinfo = "0.29.0"
strum = { version = "0.28.0", features = ["derive"] }
time = "0.3.55"
tokei = { version = "15.0.0", default-features = false }
tokio = { version = "1.54.1", features = ["full", "tracing"] }
tokio-tar = "0.3.1"
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "std"] }
tracing-unwrap = "1.0.1"
trust-dns-resolver = { version = "0.23.2", features = ["dnssec-ring"] }
url = "2.5.8"
utoipa = { version = "4.2.3", features = ["actix_extras", "chrono", "url", "uuid"] }
utoipa-rapidoc = { version = "1", features = ["actix-web"] }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "conditional-ui"] }
zip = { version = "0.5.13", default-features = false, features = ["deflate", "time"] }

[build-dependencies]
vergen = { version = "6.0.0", default-features = false, features = ["git", "rustc"] }
