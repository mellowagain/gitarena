[package]
name = "gitarena"
version = { workspace = true }
authors = { workspace = true }
edition = "2024"
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
build = "build.rs"

[[bin]]
name = "gitarena"

[lints]
workspace = true

[dependencies]
actix-files = "0.6.10"
actix-identity = "0.9.0"
actix-multipart = "0.7.2"
actix-web = { version = "4.13.0", features = ["secure-cookies"] }
anyhow = "1.0.102"
askalono = { version = "0.4.4", git = "https://github.com/mellowagain/askalono" } # Currently uses my own fork until https://github.com/jpeddicord/askalono/pull/73 is merged
async-compression = { version = "0.4.33", features = ["gzip", "tokio"] }
async-recursion = "1.0.0"
async-trait = "0.1.52"
awc = { version = "3.8.2", features = ["rustls"] } # awc uses rustls for the time being because of version conflicts with openssl
base64 = "0.22.1"
bstr = "1.12.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-humanize = "0.2.1"
console-subscriber = { version = "0.5.0", features = ["parking_lot"] }
derive_more = { version = "2.1.1", features = ["debug"] }
fs_extra = "1.2.0"
futures = "0.3.32"
futures-locks = "0.7.0"
gix = { version = "0.83.0", features = ["async-network-client", "max-performance"] }
git2 = "0.20.4"
gitarena-common = { path = "../gitarena-common" }
gitarena-macros = { path = "../gitarena-macros" }
hex = "0.4.3"
image = "0.25.10"
infer = "0.19.0"
ipnetwork = { workspace = true }
itertools = "0.14.0"
linguist = "0.1.9"
lettre = { version = "0.11.21", features = ["smtp-transport", "tokio1", "tokio1-native-tls"] }
maxminddb = "0.28"
md5 = "0.8.0"
memmem = "0.1.1"
multimap = { version = "0.10.1", features = ["serde"] }
notify = "9.0.0-rc.3"
num_cpus = "1.13.1"
oauth2 = { version = "4.1.0", default-features = false, git = "https://github.com/mellowagain/oauth2-rs" }
once_cell = "1.21.4"
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-instrumentation-actix-web = { version = "0.23.0", features = ["metrics", "awc"] }
opentelemetry-semantic-conventions = { workspace = true }
openssh-keys = "0.6.5"
parity-tokio-ipc = "0.9.0"
qstring = "0.7.2"
rand = "0.10.1"
regex = "1.5.5"
rust-argon2 = { version = "3.0.0", features = ["crossbeam-utils"] }
russh = { workspace = true }
serde = { version = "1.0.133", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.149"
sqlx = { workspace = true }
sysinfo = "0.38.4"
tempfile = "3.3.0"
tera = { version = "1.20.1", features = ["builtins"] }
time = "0.3.47"
tokei = { version = "14.0.0", default-features = false }
tokio = { version = "1.50.0", features = ["full", "tracing"] }
tokio-tar = "0.3.0"
tracing = "0.1.29"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.6", features = ["env-filter", "json", "std"] }
tracing-unwrap = "1.0.1"
trust-dns-resolver = { version = "0.23.2", features = ["dnssec-ring"] }
url = "2.5.8"
utoipa = { version = "5", features = ["actix_extras", "chrono", "url"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
utoipa-rapidoc = { version = "6", features = ["actix-web"] }
zip = { version = "8.6.0",  default-features = false, features = ["deflate", "time"] }

[build-dependencies]
vergen = { version = "8.3.2", default-features = false, features = ["git", "rustc"] }
