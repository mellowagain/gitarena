[package]
name = "gitarena"
version = { workspace = true }
authors = { workspace = true }
edition = "2024"
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
build = "build.rs"

[[bin]]
name = "gitarena"

[lints]
workspace = true

[dependencies]
actix-identity = "0.9.0"
actix-multipart = "0.7.2"
actix-web = { version = "4.13.0", features = ["secure-cookies"] }
anyhow = "1.0.102"
askalono = { version = "0.4.4", git = "https://github.com/mellowagain/askalono" } # Currently uses my own fork until https://github.com/jpeddicord/askalono/pull/73 is merged
askama = { version = "0.16.0", default-features = false, features = ["config", "derive", "std"] }
async-compression = { version = "0.4.33", features = ["gzip", "tokio"] }
async-recursion = "1.0.0"
async-trait = "0.1.52"
awc = { version = "3.8.2", features = ["rustls"] } # awc uses rustls for the time being because of version conflicts with openssl
base64 = "0.22.1"
bstr = "1.12.1"
chrono = { version = "0.4.44", features = ["serde"] }
console-subscriber = { version = "0.5.0", features = ["parking_lot"] }
derive_more = { version = "2.1.1", features = ["debug"] }
either = "1.15.0"
fang = { version = "0.11.0-rc1", default-features = false, features = ["asynk-postgres"], git = "https://github.com/ayrat555/fang", rev = "f7b5cac" }
fs2 = "0.4.3"
fs_extra = "1.2.0"
futures = "0.3.32"
futures-locks = "0.7.0"
git2 = "0.20.4"
gitarena-macros = { path = "../gitarena-macros" }
gix = { version = "0.75.0", features = ["async-network-client", "max-performance"] }
hex = "0.4.3"
image = "0.25.10"
infer = "0.19.0"
ipnetwork = { version = "=0.21.1", features = ["serde"] } # needs to be in sync with the version sqlx uses
itertools = "0.14.0"
lettre = { version = "0.11.22", features = ["smtp-transport", "tokio1", "tokio1-native-tls"] }
linguist = "0.1.9"
maxminddb = "0.28"
md5 = "0.8.0"
memmem = "0.1.1"
meilisearch-sdk = "0.33.0"
num_cpus = "1.13.1"
oauth2 = { version = "4.1.0", default-features = false, git = "https://github.com/mellowagain/oauth2-rs" }
once_cell = "1.21.4"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = { version = "0.32.0", default-features = false, features = ["log"] }
opentelemetry-instrumentation-actix-web = { version = "0.24.0", features = ["metrics", "awc"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "tls-webpki-roots", "http-proto", "http-json", "reqwest-rustls-webpki-roots"] }
opentelemetry-semantic-conventions = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
qstring = "0.7.2"
rand = "0.10.1"
russh = { version = "0.60.2", features = ["aws-lc-rs", "serde"] }
rust-argon2 = { version = "3.0.0", features = ["crossbeam-utils"] }
serde = { version = "1.0.133", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "ipnetwork", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
sysinfo = "0.38.4"
time = "0.3.5"
tokei = { version = "14.0.0", default-features = false }
tokio = { version = "1.50.0", features = ["full", "tracing"] }
tokio-tar = "0.3.0"
tracing = "0.1.29"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.6", features = ["env-filter", "json", "std"] }
tracing-unwrap = "1.0.1"
trust-dns-resolver = { version = "0.23.2", features = ["dnssec-ring"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "url", "uuid"] }
utoipa-rapidoc = { version = "6", features = ["actix-web"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
zip = { version = "8.6.0",  default-features = false, features = ["deflate", "time"] }
log = "0.4.29"

[build-dependencies]
vergen = { version = "8.3.2", default-features = false, features = ["git", "rustc"] }
