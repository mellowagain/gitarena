[workspace]
resolver = "3"
members = ["gitarena", "gitarena-common", "gitarena-macros", "gitarena-ssh", "gitarena-workhorse"]

[workspace.package]
version = "0.0.0"
authors = ["Mari <me@mari.zip>"]
description = "Software development platform with built-in vcs, issue tracking and code review"
edition = "2024"
license = "MIT"
repository = "https://github.com/mellowagain/gitarena"
readme = "README.md"

[workspace.dependencies]
sqlx = { version = "0.8.6", features = ["chrono", "ipnetwork", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
ipnetwork = { version = "=0.20.0", features = ["serde"] } # needs to be in sync with the version sqlx uses^

[profile.release]
lto = true

[patch.crates-io]
gitarena-macros = { path = "gitarena-macros" }
