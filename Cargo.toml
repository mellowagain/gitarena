[workspace]
resolver = "3"
members = ["gitarena", "gitarena-macros", "gitarena-issues"]

[workspace.package]
version = "0.0.0"
authors = ["Mari <me@mari.zip>"]
description = "Software development platform with built-in vcs, issue tracking and code review"
edition = "2024"
license = "MIT"
repository = "https://github.com/mellowagain/gitarena"
readme = "README.md"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
used_underscore_binding = "allow"
enum_glob_use = "allow"
items_after_statements = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"

[workspace.dependencies]
anyhow = "1.0.52"
base64 = "0.22.1"
chrono = { version = "0.4.19", features = ["serde"] }
gix = { version = "0.75.0", features = ["max-performance"] }
hex = "0.4.3"
rand = "0.10.1"
serde = { version = "1.0.133", features = ["derive"] }
serde_json = "1.0.75"
tracing = "0.1.29"
uuid = { version = "1", features = ["serde"] }

[patch.crates-io]
gitarena-macros = { path = "gitarena-macros" }
gitarena-issues = { path = "gitarena-issues" }

[profile.release]
lto = true
