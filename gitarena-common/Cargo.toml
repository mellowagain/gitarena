[package]
name = "gitarena-common"
version = { workspace = true }
authors = { workspace = true }
description = "Shared code for GitArena packages"
edition = { workspace = true }
repository = { workspace = true }
build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = "3.0.0"
console-subscriber = { version = "0.5.0", features = ["parking_lot"] }
futures = "0.3.32"
futures-locks = "0.7.0"
gitarena-macros = "0.0.0"
log = "0.4.29"
num-derive = "0.4.2"
num-traits = "0.2.14"
num_cpus = "1.13.1"
once_cell = "1.21.4"
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde = { version = "1.0.133", features = ["derive"] }
sqlx = { workspace = true }
tokio = { version = "1.50.0", features = ["full", "tracing"] }
tracing = "0.1.29"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.6", features = ["env-filter", "json", "std"] }
tracing-unwrap = "1.0.1"
russh = { workspace = true }
