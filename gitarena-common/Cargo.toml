[package]
name = "gitarena-common"
version = { workspace = true }
authors = { workspace = true }
description = "Shared code for GitArena packages"
edition = { workspace = true }
repository = { workspace = true }
build = "build.rs"

[dependencies]
anyhow = "1.0.52"
base64 = "0.13.0"
bincode = "1.3.3"
console-subscriber = { version = "0.1.3", features = ["parking_lot"] }
futures = "0.3.19"
futures-locks = "0.7.0"
gitarena-macros = "0.0.0"
log = "0.4.14"
num-derive = "0.3.3"
num-traits = "0.2.14"
num_cpus = "1.13.1"
once_cell = "1.9.0"
serde = { version = "1.0.133", features = ["derive"] }
sqlx = { workspace = true }
tokio = { version = "1.15.0", features = ["full", "tracing"] }
tracing = "0.1.29"
tracing-appender = "0.2.0"
tracing-subscriber = { version = "0.3.6", features = ["env-filter", "json", "std"] }
tracing-unwrap = "0.9.2"
