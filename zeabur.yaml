apiVersion: zeabur.com/v1
kind: Template
metadata:
    name: GitArena
spec:
    description: Software development platform with built-in vcs, issue tracking and code review
    tags:
        - Git
        - Developer Tools
    variables:
        - key: PUBLIC_DOMAIN
          type: DOMAIN
          name: Frontend Domain
          description: The domain for the GitArena frontend
        - key: BACKEND_DOMAIN
          type: DOMAIN
          name: Backend Domain
          description: The domain for the GitArena backend API
    services:
        - name: postgres
          icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/postgresql.svg
          template: PREBUILT
          spec:
              source:
                  image: postgres:trixie
              ports:
                  - id: database
                    port: 5432
                    type: TCP
              volumes:
                  - id: pgdata
                    dir: /var/lib/postgresql/data
              env:
                  POSTGRES_DB:
                      default: gitarena
                  POSTGRES_USER:
                      default: gitarena
                  POSTGRES_PASSWORD:
                      default: ${PASSWORD}
                      expose: true
                  POSTGRES_HOST:
                      default: ${CONTAINER_HOSTNAME}
                      expose: true
                      readonly: true
                  POSTGRES_PORT:
                      default: ${DATABASE_PORT}
                      expose: true
                      readonly: true
                  DATABASE_URL:
                      default: postgresql://gitarena:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/gitarena?sslmode=disable
                      expose: true
                      readonly: true

        - name: gitarena
          template: GIT
          domainKey: BACKEND_DOMAIN
          dependencies:
              - postgres
          spec:
              source:
                  source: GITHUB
                  watchPaths:
                      - /gitarena/
                      - /gitarena-common/
                      - /gitarena-macros/
                      - /gitarena-ssh/
                      - /gitarena-workhorse/
                      - /migrations/
                      - /Cargo.toml
                      - /Cargo.lock
                      - /Dockerfile
              ports:
                  - id: web
                    port: 8080
                    type: HTTP
              volumes:
                  - id: repos
                    dir: /repositories
              env:
                  DATABASE_URL:
                      default: ${DATABASE_URL}
                  BIND_ADDRESS:
                      default: 0.0.0.0:8080
                  SERVE_STATIC_FILES:
                      default: "false"

        - name: gitarena-frontend
          template: GIT
          domainKey: PUBLIC_DOMAIN
          dependencies:
              - gitarena
          spec:
              source:
                  source: GITHUB
                  rootDirectory: gitarena-frontend
                  watchPaths:
                      - /gitarena-frontend/
              ports:
                  - id: web
                    port: 3000
                    type: HTTP
              env:
                  NEXT_PUBLIC_API_URL:
                      default: https://${BACKEND_DOMAIN}
